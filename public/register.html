<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create a Roamly account to review tourist destinations and share your travel experiences.">
  <title>Sign Up — Roamly</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="/" class="nav__brand">
        <svg class="nav__brand-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
        Roamly
      </a>
      <div class="nav__links">
        <a href="/" class="nav__link">Home</a>
        <a href="/explore.html" class="nav__link">Explore</a>
      </div>
      <div class="nav__auth" id="nav-auth"></div>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
        <span class="nav__toggle-line"></span><span class="nav__toggle-line"></span><span class="nav__toggle-line"></span>
      </button>
    </div>
    <div class="nav__mobile" id="nav-mobile">
      <a href="/" class="nav__link">Home</a>
      <a href="/explore.html" class="nav__link">Explore</a>
      <div id="nav-mobile-auth"></div>
    </div>
  </nav>

  <main class="page-content">
    <div class="auth-page">
      <div class="auth-card">
        <h1 class="auth-card__title">Join Roamly</h1>
        <p class="auth-card__subtitle">Create an account to share your travel experiences.</p>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label" for="reg-name">Full Name</label>
            <input type="text" class="form-input" id="reg-name" required placeholder="Your full name">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-username">Username</label>
            <input type="text" class="form-input" id="reg-username" required placeholder="Choose a username" pattern="[a-zA-Z0-9_]+" minlength="3" maxlength="30">
            <span class="form-hint">3-30 characters, letters, numbers, and underscores only.</span>
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-email">Email</label>
            <input type="email" class="form-input" id="reg-email" required autocomplete="email" placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-password">Password</label>
            <input type="password" class="form-input" id="reg-password" required minlength="6" placeholder="At least 6 characters">
          </div>
          <div class="form-group">
            <label class="form-label" for="reg-confirm">Confirm Password</label>
            <input type="password" class="form-input" id="reg-confirm" required placeholder="Repeat your password">
          </div>
          <button type="submit" class="btn btn--primary btn--full btn--lg" id="register-btn">Create Account</button>
        </form>

        <p class="auth-card__footer">
          Already have an account? <a href="/login.html">Log in</a>
        </p>
      </div>
    </div>
  </main>

  <script>
    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('register-btn');
      const name = document.getElementById('reg-name').value.trim();
      const username = document.getElementById('reg-username').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const confirmPassword = document.getElementById('reg-confirm').value;

      if (!name || !username || !email || !password || !confirmPassword) {
        toast.error('Please fill in all fields.');
        return;
      }
      if (password !== confirmPassword) {
        toast.error('Passwords do not match.');
        return;
      }
      if (password.length < 6) {
        toast.error('Password must be at least 6 characters.');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Creating account...';

      try {
        const res = await api.post('/auth/register', { name, username, email, password, confirmPassword });
        if (res && res.token) localStorage.setItem('roamly_token', res.token);
        toast.success('Account created! Welcome to Roamly.');
        setTimeout(() => window.location.href = '/', 500);
      } catch (error) {
        toast.error(error.message);
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    });
  </script>
  <script src="/js/app.js"></script>
  <script src="/js/pages.js"></script>
</body>
</html>
