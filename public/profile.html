<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your Roamly profile — manage your reviews and account settings.">
  <title>My Profile — Roamly</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/responsive.css">
</head>
<body>

  <nav class="nav" role="navigation" aria-label="Main navigation">
    <div class="nav__inner">
      <a href="/" class="nav__brand">
        <svg class="nav__brand-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/></svg>
        Roamly
      </a>
      <div class="nav__links">
        <a href="/" class="nav__link">Home</a>
        <a href="/explore.html" class="nav__link">Explore</a>
        <a href="/write-review.html" class="nav__link">Write a Review</a>
      </div>
      <div class="nav__auth" id="nav-auth"></div>
      <button class="nav__toggle" id="nav-toggle" aria-label="Toggle menu">
        <span class="nav__toggle-line"></span><span class="nav__toggle-line"></span><span class="nav__toggle-line"></span>
      </button>
    </div>
    <div class="nav__mobile" id="nav-mobile">
      <a href="/" class="nav__link">Home</a>
      <a href="/explore.html" class="nav__link">Explore</a>
      <a href="/write-review.html" class="nav__link">Write a Review</a>
      <div id="nav-mobile-auth"></div>
    </div>
  </nav>

  <main class="page-content">
    <div class="container" style="padding-bottom: var(--space-3xl);">

      <div class="profile-header">
        <div class="profile-avatar" id="profile-avatar">?</div>
        <div>
          <h1 class="profile-info__name" id="profile-name">Loading...</h1>
          <p class="profile-info__username" id="profile-username"></p>
          <p class="profile-info__joined" id="profile-joined"></p>
        </div>
      </div>

      <div class="profile-stats">
        <div class="profile-stat">
          <div class="profile-stat__value" id="review-count">0</div>
          <div class="profile-stat__label">Reviews</div>
        </div>
      </div>

      <div class="tabs">
        <button class="tab-btn tab-btn--active" data-tab="tab-reviews">My Reviews</button>
        <button class="tab-btn" data-tab="tab-settings">Edit Profile</button>
      </div>

      <div class="tab-panel tab-panel--active" id="tab-reviews">
        <div id="user-reviews">
          <div class="loading"><div class="loading__spinner"></div></div>
        </div>
      </div>

      <div class="tab-panel" id="tab-settings">
        <div class="auth-card" style="max-width: 480px;">
          <h3 style="font-family: var(--font-heading); font-size: var(--text-xl); margin-bottom: var(--space-lg);">Edit Profile</h3>
          <form id="profile-form">
            <div class="form-group">
              <label class="form-label" for="edit-name">Full Name</label>
              <input type="text" class="form-input" id="edit-name" required>
            </div>
            <div class="form-group">
              <label class="form-label" for="edit-username">Username</label>
              <input type="text" class="form-input" id="edit-username" required pattern="[a-zA-Z0-9_]+" minlength="3" maxlength="30">
            </div>
            <button type="submit" class="btn btn--primary">Save Changes</button>
          </form>
        </div>
      </div>

    </div>
  </main>

  <footer class="footer">
    <div class="container"><div class="footer__bottom">&copy; 2026 Roamly. All rights reserved.</div></div>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
